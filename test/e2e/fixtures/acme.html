<!doctype html><html><head><meta charset="utf-8"><title>Acme · Senior Engineer, Payments</title><link rel="stylesheet" href="_style.css"></head><body>
<h1>Senior Engineer, Payments</h1><p class="sub">Acme · Singapore or remote</p>
<form onsubmit="event.preventDefault()">
  <div class="f"><label for="n">Full name</label><input id="n" name="full_name"></div>
  <div class="f"><label for="e">Email</label><input id="e" type="email" name="email"></div>
  <div class="f"><label for="l">LinkedIn URL</label><input id="l" name="linkedin_url"></div>
  <div class="f"><label for="w">Why do you want to join Acme?</label><textarea id="w" maxlength="800"></textarea></div>
  <div class="f"><label for="i">Describe the most impactful thing you've built. Include numbers if you can.</label><textarea id="i" maxlength="1200"></textarea></div>
  <div class="f"><label for="d">What would you want to work on in your first 90 days?</label><textarea id="d" maxlength="800"></textarea></div>
  <button>Submit</button>
</form></body></html>
